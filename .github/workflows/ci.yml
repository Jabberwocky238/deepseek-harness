name: ci

on:
  push:
    branches: [master, 'feat/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The published tarball must resolve and boot on its own; a broken
      # exports path or a missing runtime dependency only shows up here.
      - run: pnpm run verify:consumer
