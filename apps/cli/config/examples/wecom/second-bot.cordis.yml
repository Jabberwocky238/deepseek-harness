- insert:
    - id: wecom-two
      name: '@deepseek-ai/dsh-wecom'
      config:
        botId: !!js process.env.WECOM_BOT_2_ID
        secretEnv: WECOM_BOT_2_SECRET
        wsUrl: !!js process.env.WECOM_WS_URL || 'wss://openws.work.weixin.qq.com'
        allowedUsers: !!js (process.env.WECOM_ALLOWED_USERS || '').split(',').map(value => value.trim()).filter(Boolean)
        workspacePath: !!js process.cwd()
        agentPreset: standard
        permissionPreset: workspace-write
        language: zh
