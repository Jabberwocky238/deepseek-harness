- insert:
    - id: webwjkj-server
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 3081
    - id: webwjkj-storage
      name: '@deepseek-ai/dsh-storage'
    - id: webwjkj-storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('webwjkj', 'im')
    - id: webwjkj-storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config: { backend: json }
    - id: webwjkj-im
      name: '@deepseek-ai/dsh-im'
      config:
        maxParticipants: 10000
        maxConversations: 10000
        maxMessages: 100000
        maxTextBytes: 16384
        maxAttachmentBytes: 10485760
        maxAttachments: 10
    - id: webwjkj-settings
      name: '@deepseek-ai/dsh-settings-file'
    - id: webwjkj-credentials
      name: '@deepseek-ai/dsh-credentials-local'
    - id: webwjkj-llm
      name: '@deepseek-ai/dsh-llm'
    - id: webwjkj-llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
    - id: webwjkj-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-flash
    - id: webwjkj-sessions
      name: '@deepseek-ai/dsh-session'
    - id: webwjkj-session-persistence
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('webwjkj', 'sessions')
    - id: webwjkj-projections
      name: '@deepseek-ai/dsh-session-projection'
    - id: webwjkj-system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: 'You are default agent, a helpful chat assistant. The user supplies a JSON array of recent conversation messages ordered from oldest to newest. Answer the last user message using that history. Reply in the user’s language with ordinary text.'
    - id: webwjkj-tools
      name: '@deepseek-ai/dsh-tools'
    - id: webwjkj-agents
      name: '@deepseek-ai/dsh-agent'
    - id: webwjkj-agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config: { agents: [] }
    - id: webwjkj-default-agent
      name: '@deepseek-ai/dsh-webwjkj/default-agent'
      config: { timeoutMs: 120000, historyMessages: 32, maxTokens: 2048, maxAiMessages: 100000 }
    - id: webwjkj-home
      name: '@deepseek-ai/dsh-webwjkj'
      config:
        workbenchRoot: bundled
        auth:
          root: !!js dshHomePath('webwjkj')
          publicOrigin: !!js process.env.WEBWJKJ_PUBLIC_ORIGIN || 'http://127.0.0.1:3081'
          sms: !!js >-
            process.env.WEBWJKJ_SMS_APP_ID ? ({ sdkAppId: process.env.WEBWJKJ_SMS_APP_ID, signName: process.env.WEBWJKJ_SMS_SIGN, templateId: process.env.WEBWJKJ_SMS_TEMPLATE_ID, region: process.env.WEBWJKJ_SMS_REGION, secretIdEnv: 'TENCENTCLOUD_SECRET_ID', secretKeyEnv: 'TENCENTCLOUD_SECRET_KEY' }) : undefined
          mail: !!js >-
            process.env.WEBWJKJ_SMTP_HOST ? ({ host: process.env.WEBWJKJ_SMTP_HOST, port: Number(process.env.WEBWJKJ_SMTP_PORT), secure: process.env.WEBWJKJ_SMTP_SECURE === 'true', user: process.env.WEBWJKJ_SMTP_USER, passwordEnv: 'WEBWJKJ_SMTP_PASSWORD', from: process.env.WEBWJKJ_SMTP_FROM }) : undefined
          wechat: !!js >-
            process.env.WEBWJKJ_WECHAT_APP_ID ? ({ appId: process.env.WEBWJKJ_WECHAT_APP_ID, secretEnv: 'WEBWJKJ_WECHAT_APP_SECRET' }) : undefined
