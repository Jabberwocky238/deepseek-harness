[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "deepseek-harness-wecom"
version = "0.0.0.dev0"
description = "WeCom Smart Robot channel for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]
dependencies = [
  "aiohttp>=3.9",
  "httpx>=0.27",
  "cryptography>=42",
  "deepseek-harness-sdk==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/deepseek-ai/deepseek-harness"
Issues = "https://github.com/deepseek-ai/deepseek-harness/issues"
Source = "https://github.com/deepseek-ai/deepseek-harness"

[dependency-groups]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["dsh_wecom"]

[tool.uv.sources]
deepseek-harness-sdk = { path = "../sdk", editable = true }
